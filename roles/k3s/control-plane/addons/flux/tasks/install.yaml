---
- name: Check Flux CLI availability
  ansible.builtin.command: which flux
  register: flux_check
  changed_when: false
  failed_when: false

- name: Install Flux CLI # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -o pipefail
    curl -s https://fluxcd.io/install.sh | bash
  args:
    executable: /bin/bash
  changed_when: true
  when: flux_check.rc != 0

- name: Ensure bash completion directory exists
  ansible.builtin.file:
    path: /etc/bash_completion.d
    state: directory
    mode: "0755"

- name: Enable Flux shell completion
  ansible.builtin.shell: flux completion bash > /etc/bash_completion.d/flux
  args:
    executable: /bin/bash
    creates: /etc/bash_completion.d/flux
