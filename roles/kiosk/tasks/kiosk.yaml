---
- name: Disable local login on primary TTY
  ansible.builtin.systemd:
    name: getty@tty1
    enabled: false
    state: stopped

- name: Install kiosk runtime packages
  ansible.builtin.apt:
    name:
      - cage
      - chromium
      - dbus
      - fonts-dejavu-core
      - fonts-noto-color-emoji
      - wtype
    state: present
    install_recommends: false
    update_cache: true

- name: Grant input and GPU device access to kiosk user
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: input,video,render
    append: true

- name: Resolve bodgestr .deb download URL
  ansible.builtin.set_fact:
    bodgestr_deb_url: >-
      {{
        (lookup('url', 'https://api.github.com/repos/mzellho/bodgestr/releases/latest',
                 headers={'Accept': 'application/vnd.github+json'}) | from_json).assets
        | map(attribute='browser_download_url')
        | select('search',
            '_' ~ ('arm64' if ansible_architecture == 'aarch64' else 'amd64') ~
            '_' ~ ansible_distribution_release ~
            '\.deb$'
          )
        | list
        | first
      }}

- name: Install latest bodgestr package
  ansible.builtin.apt:
    deb: "{{ bodgestr_deb_url }}"
    state: present

- name: Ensure bodgestr log directory exists
  ansible.builtin.file:
    path: /var/log/bodgestr
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy gesture configuration
  ansible.builtin.copy:
    dest: /etc/bodgestr/gestures.toml
    owner: root
    group: root
    mode: "0644"
    content: |
      [global]
      log_level = "info"
      log_file = "/var/log/bodgestr/bodgestr.log"

      [global.thresholds]
      swipe_time_max = 0.9
      swipe_distance_min_pct = 0.15
      angle_tolerance_deg = 30.0
      tap_time_max = 0.2
      tap_distance_max = 50.0
      long_press_time_min = 0.8
      double_tap_interval = 0.3
      double_tap_distance_max = 50.0
      pinch_threshold_pct = 0.1

      [global.gestures.tap]
      action = "wtype -M ctrl -k Return"
      enabled = true

      [global.gestures.swipe_left]
      action = "wtype -M ctrl -k Tab"
      enabled = true

      [global.gestures.swipe_right]
      action = "wtype -M ctrl -M shift -k Tab"
      enabled = true

      [global.gestures.swipe_down]
      action = "wtype -k F5"
      enabled = true

      [global.gestures.pinch_in]
      action = "wtype -M ctrl -k minus"
      enabled = true

      [global.gestures.pinch_out]
      action = "wtype -M ctrl -k equal"
      enabled = true

      [device.kiosk]
      device_usb_id = "{{ bodgestr_device_usb_id }}"
      enabled = true

- name: Ensure bodgestr service override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/bodgestr.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure bodgestr service override
  ansible.builtin.copy:
    dest: /etc/systemd/system/bodgestr.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      After=
      After=kiosk.service
      BindsTo=kiosk.service

      [Service]
      User={{ ansible_user }}
      Group={{ ansible_user }}
      SupplementaryGroups=input
      Environment=WAYLAND_DISPLAY=wayland-0
      Environment=XDG_RUNTIME_DIR=/run/user/{{ ansible_uid }}
      WorkingDirectory=/home/{{ ansible_user }}
      ProtectSystem=no
      ReadWritePaths=

- name: Install kiosk service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/kiosk.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Kiosk Browser
      After=systemd-user-sessions.service network-online.target
      Wants=network-online.target bodgestr.service

      [Service]
      User={{ ansible_user }}

      PAMName=login
      TTYPath=/dev/tty1
      StandardInput=tty
      StandardOutput=journal
      StandardError=journal

      Environment=XDG_RUNTIME_DIR=/run/user/{{ ansible_uid }}
      Environment=WLR_LIBINPUT_NO_DEVICES=1
      Environment=WLR_NO_HARDWARE_CURSORS=1

      ExecStartPre=/bin/sh -c 'mkdir -p /run/user/{{ ansible_uid }} && chown {{ ansible_user }}:{{ ansible_user }} /run/user/{{ ansible_uid }}'
      ExecStart=/usr/bin/cage -s -- chromium \
        --kiosk {{ kiosk_urls }} \
        --noerrdialogs \
        --disable-infobars \
        --disable-session-crashed-bubble \
        --disable-features=TranslateUI,TouchpadOverscrollHistoryNavigation \
        --overscroll-history-navigation=0 \
        --touch-events=enabled \
        --hide-scrollbars \
        --ozone-platform=wayland

      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Restart kiosk

- name: Enable kiosk service
  ansible.builtin.systemd:
    name: kiosk.service
    daemon_reload: true
    enabled: true
    state: started

- name: Enable bodgestr service
  ansible.builtin.systemd:
    name: bodgestr.service
    daemon_reload: true
    enabled: true
    state: restarted
